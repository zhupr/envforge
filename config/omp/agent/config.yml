modelRoles:
  default: opencode-go/deepseek-v4.1-flash
setupVersion: 3
statusLine:
  preset: custom
  leftSegments:
    - pi
    - vim
    - model
    - mode
    - path
    - git
    - pr
    - subagents
  rightSegments:
    - session_name
    - token_total
    - cache_hit
    - cost
    - context_pct
    - time_spent
composer:
  tokenRate: true
display:
  showTokenUsage: true
  showTurnTime: true
  cacheMissMarker: true
  subagentLivePreview: true
terminal:
  showProgress: true